:root{
  --ws:#EBEBED; --panel:#FFFFFF; --line:#E8E8EB; --line-2:#DCDCE0;
  --field:#F3F3F5; --field-h:#ECECEF; --fill:#E1E2E6; --fill-a:#D3D4DA;
  --text:#121316; --text-2:#6D7078; --text-3:#A2A4AB;
  --accent:#121316; --on-accent:#FFFFFF; --focus:#3C8CFF;   /* light theme only; the dark interface uses Epic Lime */
  --brand:#00142D;   /* the brand mark colour: Deep Space Navy on light, Epic Lime on dark */
  --shadow:0 1px 2px rgba(16,18,24,.06),0 8px 24px rgba(16,18,24,.08);
  --pop-shadow:0 2px 6px rgba(16,18,24,.06),0 18px 48px rgba(16,18,24,.16);
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --r:7px; --row:30px; --pad:16px;
  --font:"EpicNum","Poppins",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --ws:#111215; --panel:#18191C; --line:#25262B; --line-2:#2F3036;
  --field:#212227; --field-h:#27282E; --fill:#33353C; --fill-a:#41434B;
  --text:#F1F1F3; --text-2:#9EA1A9; --text-3:#686B73;
  --accent:#F1F1F3; --on-accent:#111215;
  --brand:#B6EA00; --focus:#B6EA00;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  --pop-shadow:0 2px 6px rgba(0,0,0,.3),0 18px 48px rgba(0,0,0,.5);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden}
body{background:var(--ws);color:var(--text);font:400 12px/1.4 var(--font);letter-spacing:.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-radius:6px}
::selection{background:rgba(182,234,0,.35);color:inherit}
.num,.val{font-variant-numeric:tabular-nums}
svg.i{width:16px;height:16px;flex:none;display:block}

/* ---------- layout ---------- */
.app{--lw0:220px;--rw0:300px;position:relative;display:grid;grid-template-columns:var(--lw,var(--lw0)) minmax(0,1fr) var(--rw,var(--rw0));grid-template-rows:48px minmax(0,1fr);height:100%;transition:grid-template-columns .28s var(--ease-out)}
.app[data-ui="off"]{grid-template-columns:0 minmax(0,1fr) 0}
.app[data-ui="off"] .panel{opacity:0;pointer-events:none}
/* the panels keep their width while their column folds away, so the looks and controls fade out in place instead of reflowing */
.panel.left{width:var(--lw,var(--lw0));justify-self:start}
.panel.right{width:var(--rw,var(--rw0));justify-self:end}
/* panel width handles on the inner edges, like Figma's */
.rz{position:absolute;z-index:6;top:48px;bottom:0;width:9px;cursor:col-resize;touch-action:none}
.rz::after{content:"";position:absolute;top:0;bottom:0;left:4px;width:1px;background:var(--brand);opacity:0;transition:opacity .16s}
.rz-left{left:calc(var(--lw,var(--lw0)) - 5px)}
.rz-right{right:calc(var(--rw,var(--rw0)) - 5px)}
.rz.on::after,.rz:focus-visible::after{opacity:1}
.rz:focus-visible{outline:none}
@media (hover:hover) and (pointer:fine){.rz:hover::after{opacity:1;transition-delay:.12s}}
.app[data-ui="off"] .rz{display:none}
.app.resizing{transition:none}
.app.resizing,.app.resizing *{cursor:col-resize!important}
.topbar{grid-column:1/-1;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 10px 0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.tb-left,.tb-right{display:flex;align-items:center;gap:6px}
.tb-right{justify-content:flex-end}
.tb-center{display:flex;align-items:center;gap:2px}
.mark{display:flex;align-items:center;margin-right:18px;text-decoration:none;color:var(--brand)}
.mark .logo{height:13px;width:auto;display:block}
.mark .logo .logo-b{fill:var(--text)}
.pages{display:flex;gap:2px;padding:2px;background:var(--field);border-radius:8px}
.pages a{padding:4px 10px;border-radius:6px;color:var(--text-2);text-decoration:none;font-size:12px;transition:background .16s var(--ease-out),color .16s}
.pages a[aria-current="page"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (hover:hover) and (pointer:fine){.pages a:not([aria-current]):hover{color:var(--text)}}
.ib{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--text-2);transition:background .16s var(--ease-out),color .16s,transform .16s var(--ease-out)}
.ib:active{transform:scale(.94)}
.ib:disabled{opacity:.35;cursor:default}
@media (hover:hover) and (pointer:fine){.ib:not(:disabled):hover{background:var(--field);color:var(--text)}}
.ib[aria-pressed="true"]{color:var(--text);background:var(--field)}
.tsep{width:1px;height:18px;background:var(--line-2);margin:0 6px}
.btn{height:32px;padding:0 14px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--field);color:var(--text);white-space:nowrap;transition:background .16s var(--ease-out),transform .16s var(--ease-out),opacity .16s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
@media (hover:hover) and (pointer:fine){.btn:not(:disabled):hover{background:var(--field-h)}}
.btn.primary{background:var(--accent);color:var(--on-accent)}
/* the one lime button: Export, in Epic Lime with Navy text in both themes */
#exportBtn{background:#B6EA00;color:#00142D;font-weight:500}
@media (hover:hover) and (pointer:fine){#exportBtn:not(:disabled):hover{background:#C4F032;opacity:1}}
@media (hover:hover) and (pointer:fine){.btn.primary:not(:disabled):hover{background:var(--accent);opacity:.88}}
.btn.wide{width:100%}
.btn.sm{height:28px;padding:0 10px;border-radius:7px}
.kbd{font-size:10.5px;color:var(--text-3);margin-left:2px}
.btn.primary .kbd{color:inherit;opacity:.55}

/* ---------- panels ---------- */
.panel{container-type:inline-size;background:var(--panel);overflow-y:auto;overflow-x:hidden;transition:opacity .2s var(--ease-out);scrollbar-width:thin;scrollbar-color:var(--line-2) transparent;min-width:0}
/* panels sit on top of the canvas, which runs under them: resizing or hiding them never moves the artboard */
.panel.left{grid-column:1;grid-row:2;z-index:4;border-right:1px solid var(--line)}
/* the studio's credit sits at the foot of the left panel, below everything else */
.panel.left{display:flex;flex-direction:column}
.panel.left>*{flex:none}
.credit{margin-top:auto;padding:24px 16px 16px;color:#3B3B3B;display:block;width:max-content;transition:color .16s}
.credit svg{width:68px;height:auto;display:block}
@media (hover:hover) and (pointer:fine){.credit:hover{color:var(--text-3)}}
.panel.right{grid-column:3;grid-row:2;z-index:4;border-left:1px solid var(--line)}

/* sections: a header that folds the body away, Figma style */
.sec{border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;gap:2px;height:46px;padding:0 8px 0 var(--pad);cursor:pointer;-webkit-user-select:none;user-select:none}
.sec-h:focus-visible{outline-offset:-2px;border-radius:0}
.sec-t{flex:1;min-width:0;font-size:13px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .16s}
.sec.closed .sec-t{color:var(--text-2)}
.sec-a{display:flex;align-items:center;gap:2px}
.sec.closed .sec-a{display:none}
.chev{width:28px;height:28px;display:grid;place-items:center;flex:none;color:var(--text-3);transition:transform .22s var(--ease-out),color .16s}
.chev svg{width:14px;height:14px}
.sec.closed .chev{transform:rotate(-90deg)}
@media (hover:hover) and (pointer:fine){.sec-h:hover .chev,.sec.closed .sec-h:hover .sec-t{color:var(--text)}}
.sec-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .24s var(--ease-out)}
.sec.closed .sec-b{grid-template-rows:0fr}
.sec-in{min-height:0;transition:visibility 0s}
.sec.closed .sec-in,.sec.anim .sec-in{overflow:hidden}
.sec.closed .sec-in{visibility:hidden;transition:visibility 0s linear .24s}
.sec-p{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:0 var(--pad) 20px}
.sec.headless .sec-p{padding-top:16px}
.sec-p>.rows{min-width:0}
.ib.sm{width:28px;height:28px;border-radius:7px}
/* frame size bar, fixed at the top of the settings panel */
.cbar{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:8px;height:46px;padding:0 var(--pad);background:var(--panel);border-bottom:1px solid var(--line)}
/* left panel tabs (Looks / Source) */
.ltabs{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:2px;height:46px;padding:0 8px 0 10px;background:var(--panel);border-bottom:1px solid var(--line)}
.lt{height:30px;padding:0 6px;border-radius:7px;font-size:13px;color:var(--text-3);transition:color .16s}
.lt[aria-selected="true"]{color:var(--text)}
@media (hover:hover) and (pointer:fine){.lt:not([aria-selected="true"]):hover{color:var(--text-2)}}
.lt-a{margin-left:auto;display:flex;align-items:center}
.lt-a .sec-a{display:flex}
.tabbed>.sec{border-bottom:0}
.tabbed>.sec>.sec-h{display:none}
.tabbed>.sec.closed .sec-b{grid-template-rows:1fr}
.tabbed>.sec.closed .sec-in{visibility:visible;overflow:visible}
.tabbed>.sec .sec-p{padding-top:14px}
.ib.sm[aria-pressed="true"]{color:var(--text);background:var(--field)}

/* rows, labels and pairs */
/* every column shrinks to the panel, so narrow panels squeeze their controls instead of cutting them off */
.rows{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;min-width:0}
.adv{display:grid;grid-template-columns:minmax(0,1fr);gap:8px}
.adv[hidden]{display:none}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.pair:has(>[hidden])>:not([hidden]){grid-column:1/-1}
.pair:not(:has(>:not([hidden]))){display:none}
.pair>:only-child{grid-column:1/-1}
.lbl{font-size:11.5px;color:var(--text-2);margin:6px 0 -2px;padding-left:1px;line-height:1.3}
.fld{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:6px;min-width:0}
.fld>.lbl{margin:0}
.rows>.lbl:first-child,.rows>.fld:first-child,.adv>.lbl:first-child,.adv>.fld:first-child{margin-top:0}
.hint{font-size:11px;color:var(--text-3);line-height:1.45;margin:2px 0 0}
.more{font-size:11px;color:var(--text-3);padding:2px 6px;border-radius:5px;transition:color .16s}
@media (hover:hover) and (pointer:fine){.more:hover{color:var(--text)}}

/* dropdown + menu */
.dd{height:var(--row);width:100%;min-width:0;display:flex;align-items:center;gap:6px;padding:0 6px 0 10px;border-radius:var(--r);background:var(--field);color:var(--text);font-size:12px;text-align:left;transition:background .16s var(--ease-out),box-shadow .16s}
.dd-v{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dd-c{display:grid;place-items:center;color:var(--text-3);transition:transform .2s var(--ease-out),color .16s}
.dd-c svg{width:14px;height:14px}
.dd.open{box-shadow:inset 0 0 0 1.5px var(--focus)}
.dd.open .dd-c{transform:rotate(180deg);color:var(--text)}
@media (hover:hover) and (pointer:fine){.dd:hover{background:var(--field-h)}.dd:hover .dd-c{color:var(--text)}}
.menu{position:fixed;z-index:25;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--pop-shadow);max-height:min(380px,calc(100vh - 16px));overflow:auto;opacity:0;transform:translateY(-3px);transition:opacity .14s var(--ease-out),transform .18s var(--ease-out)}
.menu.on{opacity:1;transform:none}
.mi{display:flex;align-items:center;gap:4px;width:100%;height:30px;padding:0 12px 0 6px;border-radius:6px;font-size:12px;color:var(--text);text-align:left;white-space:nowrap}
.mi-k{width:18px;display:grid;place-items:center;flex:none;opacity:0}
.mi-k svg{width:13px;height:13px}
.mi[aria-selected="true"] .mi-k{opacity:1}
.mi:focus-visible{outline:none;background:var(--field)}
@media (hover:hover) and (pointer:fine){.mi:hover{background:var(--field)}}

/* colour rows (Figma fill rows) + the palette popover */
.cr{height:var(--row);width:100%;min-width:0;display:flex;align-items:center;gap:9px;padding:0 10px 0 6px;border-radius:var(--r);background:var(--field);text-align:left;font-size:12px;transition:background .16s var(--ease-out),box-shadow .16s}
@media (hover:hover) and (pointer:fine){.cr:hover{background:var(--field-h)}}
.cr.open{box-shadow:inset 0 0 0 1.5px var(--focus)}
.cr-s{width:18px;height:18px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(127,127,127,.3)}
.cr-s.none{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/8px 8px}
:root[data-theme="dark"] .cr-s.none{background:repeating-conic-gradient(#3a3b40 0 25%,#26272b 0 50%) 0 0/8px 8px}
.cr-n{flex:1;min-width:0;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr-m{color:var(--text-3);font-size:11.5px;flex:none}
.cpop{position:fixed;z-index:25;width:256px;max-height:calc(100vh - 16px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--pop-shadow);opacity:0;transform:translateX(4px);transition:opacity .14s var(--ease-out),transform .2s var(--ease-out)}
.cpop.on{opacity:1;transform:none}
.cp-h{display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 8px 0 14px}
.cp-b{display:grid;gap:10px;padding:0 10px 12px}
.cp-l{display:grid;gap:1px}
.cp-i{display:flex;align-items:center;gap:9px;height:30px;padding:0 6px;border-radius:7px;font-size:12px;text-align:left;color:var(--text);width:100%}
.cp-i .mi-k{margin-left:auto}
.cp-i[aria-selected="true"]{background:var(--field)}
.cp-i[aria-selected="true"] .mi-k{opacity:1}
@media (hover:hover) and (pointer:fine){.cp-i:hover{background:var(--field-h)}}
.cp-sep{height:1px;background:var(--line);margin:2px -10px}

/* scrub field (drag to scrub, click to type) */
.sf{position:relative;height:var(--row);border-radius:var(--r);background:var(--field);overflow:hidden;cursor:ew-resize;user-select:none;touch-action:none;transition:background .16s var(--ease-out)}
@media (hover:hover) and (pointer:fine){.sf:hover{background:var(--field-h)}}
.sf .fill{position:absolute;inset:0 auto 0 0;background:var(--fill);transform-origin:left;pointer-events:none;transition:background .16s}
.sf.drag .fill{background:var(--fill-a)}
.sf .lab,.sf .val{position:absolute;top:0;bottom:0;display:flex;align-items:center;pointer-events:none;font-size:12px}
.sf .lab{left:10px;color:var(--text-2)}
.sf .val{right:10px;color:var(--text)}
.sf input{position:absolute;inset:0;width:100%;border:0;background:var(--panel);box-shadow:inset 0 0 0 1.5px var(--focus);border-radius:var(--r);padding:0 10px;text-align:right;font-size:12px;cursor:text}

/* segmented */
.seg{display:flex;height:var(--row);padding:2px;gap:2px;border-radius:var(--r);background:var(--field)}
.seg button{flex:1 1 auto;min-width:0;padding:0 6px;border-radius:5px;color:var(--text-2);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .16s var(--ease-out),color .16s,box-shadow .16s}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.1)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--fill-a)}
@media (hover:hover) and (pointer:fine){.seg button:not([aria-pressed="true"]):hover{color:var(--text)}}


@container (max-width:250px){.seg{gap:1px}.seg button{padding:0 2px;font-size:11.5px}}

/* toggle row */
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:var(--row);padding:0 2px 0 1px;cursor:pointer;user-select:none}
.tg span{color:var(--text);font-size:12px}
.sw{width:28px;height:16px;border-radius:9px;background:var(--fill-a);position:relative;transition:background .18s var(--ease-out);flex:none}
.sw::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:transform .2s var(--ease-out)}
.tg[aria-checked="true"] .sw{background:var(--accent)}
:root[data-theme="dark"] .tg[aria-checked="true"] .sw::after{background:var(--on-accent)}
.tg[aria-checked="true"] .sw::after{transform:translateX(12px)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{height:26px;padding:0 10px;border-radius:13px;background:var(--field);color:var(--text-2);font-size:11.5px;transition:background .16s var(--ease-out),color .16s,transform .16s var(--ease-out)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
@media (hover:hover) and (pointer:fine){.chip:not([aria-pressed="true"]):hover{color:var(--text);background:var(--field-h)}}

/* swatches */
.swl{display:grid;gap:7px;margin:2px 0 4px}
.swl>span{font-size:12px;color:var(--text-2);padding-left:2px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:22px;height:22px;border-radius:6px;position:relative;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);transition:transform .16s var(--ease-out)}
.swatch:active{transform:scale(.9)}
.swatch[aria-pressed="true"]::after{content:"";position:absolute;inset:-3px;border-radius:8px;box-shadow:0 0 0 1.5px var(--text)}
.swatch.none{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/8px 8px}
:root[data-theme="dark"] .swatch.none{background:repeating-conic-gradient(#3a3b40 0 25%,#26272b 0 50%) 0 0/8px 8px}
.swatch-cap{font-size:11px;color:var(--text-3);margin-top:2px}

/* cards (looks, shapes) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:12px 10px}
.cards.three{grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px 6px}
.card{display:flex;flex-direction:column;gap:6px;text-align:left;border-radius:9px;transition:transform .18s var(--ease-out)}
.card:active{transform:scale(.97)}
.card .th{position:relative;width:100%;aspect-ratio:4/5;border-radius:8px;overflow:hidden;background:var(--field);box-shadow:inset 0 0 0 1px var(--line)}
.card .th img,.card .th canvas{width:100%;height:100%;display:block;object-fit:cover}
.card .nm{font-size:11.5px;color:var(--text-2);padding:0 1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .16s}
.card[aria-pressed="true"] .th{box-shadow:0 0 0 1.5px var(--text)}
.card[aria-pressed="true"] .nm{color:var(--text)}
@media (hover:hover) and (pointer:fine){.card:hover .nm{color:var(--text)}}
.cards.three .card .th{aspect-ratio:1/1;border-radius:7px}
.cards.three .card .nm{font-size:10.5px;text-align:center}
.card .x{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;display:grid;place-items:center;opacity:0;transition:opacity .16s}
@media (hover:hover) and (pointer:fine){.card:hover .x{opacity:1}}
.card .x svg{width:12px;height:12px}
.card .x.up{right:auto;left:4px}

/* source preview + drop */
.srcprev{position:relative;border-radius:8px;overflow:hidden;background:var(--field)}
.srcprev canvas{display:block;width:100%;height:auto}
.srcprev .tag{position:absolute;left:8px;top:6px;font-size:11.5px;color:rgba(255,255,255,.8)}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:88px;border-radius:8px;border:1px dashed var(--line-2);color:var(--text-2);text-align:center;cursor:pointer;transition:border-color .16s,background .16s}
.drop small{color:var(--text-3);font-size:11px}
@media (hover:hover) and (pointer:fine){.drop:hover{border-color:var(--text-3);background:var(--field)}}
.media-row{display:flex;align-items:center;gap:8px;min-width:0}
.media-row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}

/* emblem tile + stage strip */
.emb{display:flex;align-items:center;gap:10px;padding:8px;border-radius:9px;background:var(--field)}
.emb canvas{width:36px;height:36px;flex:none;border-radius:6px;background:var(--panel)}
.emb .meta{flex:1;min-width:0}
.emb .meta b{display:block;font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emb .meta small{display:block;font-size:11px;color:var(--text-3)}
.stages{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:2px}
.stages canvas{width:100%;aspect-ratio:1/1;border-radius:5px;background:var(--field);display:block}
.stages-cap{display:flex;justify-content:space-between;font-size:10.5px;color:var(--text-3);margin-top:3px;padding:0 2px}

/* curve editor */
.curve{position:relative;border-radius:8px;background:var(--field);height:116px;touch-action:none}
.curve svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.curve .grid{stroke:var(--line-2);stroke-width:1}
.curve .diag{stroke:var(--text-3);stroke-dasharray:2 3;stroke-width:1}
.curve .arm{stroke:var(--text-3);stroke-width:1}
.curve .path{stroke:var(--text);stroke-width:1.75;fill:none}
.curve .h{fill:var(--panel);stroke:var(--text);stroke-width:1.5;cursor:grab}
.curve .h:active{cursor:grabbing}
.curve .run{fill:var(--focus)}

/* ---------- workspace ---------- */
.workspace{grid-column:1/-1;grid-row:2;position:relative;overflow:hidden;background:var(--ws);min-width:0}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.board-shadow{position:absolute;z-index:0;box-shadow:0 1px 3px rgba(0,0,0,.08),0 12px 40px rgba(0,0,0,.12);pointer-events:none}
:root[data-theme="dark"] .board-shadow{box-shadow:0 0 0 1px rgba(255,255,255,.04),0 12px 40px rgba(0,0,0,.5)}
.board-ui{position:absolute;z-index:2;pointer-events:none}
.board-ui .name{position:absolute;left:0;bottom:100%;margin-bottom:6px;font-size:11px;color:var(--text-2);white-space:nowrap;pointer-events:auto;cursor:default}
.board-ui .name b{font-weight:400;color:var(--text)}
.board-ui .name{margin-bottom:8px;left:50%;transform:translateX(-50%)}
.board-ui .name .cbar{position:static;height:auto;padding:0;background:none;border:0;grid-template-columns:104px 104px;gap:6px}
/* the size fields stay quiet until they are used; hiding the panels hides them too */
.board-ui .name .cbar{opacity:.4;transition:opacity .16s}
.board-ui .name .cbar:hover,.board-ui .name .cbar:focus-within,.board-ui .name .cbar:has(.drag){opacity:1}
.app[data-ui="off"] .board-ui .name{opacity:0;pointer-events:none;transition:opacity .2s}
.board-ui .frame{position:absolute;inset:0;box-shadow:0 0 0 1px var(--brand);opacity:0;transition:opacity .16s}
.board-ui.hot .frame,.board-ui.sizing .frame{opacity:1}
.hd{position:absolute;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;background:#fff;box-shadow:0 0 0 1px var(--brand);pointer-events:auto;opacity:0;transition:opacity .16s}
.board-ui.hot .hd,.board-ui.sizing .hd{opacity:1}
.ed{position:absolute;pointer-events:auto}
.size-badge{position:absolute;left:50%;top:100%;margin-top:8px;transform:translateX(-50%);background:var(--brand);color:#00142D;font-size:11px;padding:2px 7px;border-radius:5px;white-space:nowrap;opacity:0;transition:opacity .16s}
.board-ui.sizing .size-badge{opacity:1}
/* camera controls under the canvas (Emblem and Sweep): small and dim; gone while resizing or with the panels hidden */
.nav-hint{position:absolute;left:50%;top:100%;margin-top:10px;transform:translateX(-50%);display:flex;gap:14px;font-size:10.5px;color:var(--text-3);opacity:.7;white-space:nowrap;pointer-events:none;transition:opacity .16s}
.nav-hint b{font-weight:400;color:var(--text-2)}
.board-ui.sizing .nav-hint,.app[data-ui="off"] .nav-hint{opacity:0}

/* the play bar sits at the centre of the window, not of the canvas, so resizing or hiding panels never moves it */
.playbar{position:fixed;z-index:7;left:50%;bottom:calc(16px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);max-width:calc(100% - 24px)}
.tl{position:relative;width:220px;flex:0 1 220px;min-width:56px;height:28px;cursor:pointer;touch-action:none;display:flex;align-items:center}
.tl .tr{position:absolute;left:0;right:0;height:3px;border-radius:2px;background:var(--fill)}
.tl .pr{position:absolute;left:0;height:3px;border-radius:2px;background:var(--brand);transform-origin:left;width:100%}
.tl .kn{position:absolute;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--panel);box-shadow:0 0 0 1.5px var(--brand);transition:transform .16s var(--ease-out)}
.tl:active .kn{transform:scale(1.2)}
.time{min-width:74px;text-align:center;color:var(--text-2);font-size:11.5px;white-space:nowrap}
.loop-len{height:24px;padding:0 5px;margin-left:-1px;border-radius:6px;color:var(--text-2);font-size:11.5px;transition:background .16s var(--ease-out),color .16s}
@media (hover:hover) and (pointer:fine){.loop-len:hover{background:var(--field);color:var(--text)}}
.loop-in{width:52px;height:24px;border:0;border-radius:6px;padding:0 6px;background:var(--panel);color:var(--text);box-shadow:inset 0 0 0 1.5px var(--focus);text-align:center;font-size:11.5px}
.zoom{min-width:44px;text-align:center;color:var(--text-2);font-size:11.5px;height:28px;border-radius:7px}
@media (hover:hover) and (pointer:fine){.zoom:hover{background:var(--field);color:var(--text)}}
.pb-sep{width:1px;height:18px;background:var(--line-2);margin:0 2px}
.playbar .ib{width:28px;height:28px;border-radius:7px}

.drop-ov{position:absolute;inset:12px;z-index:6;border:1.5px dashed var(--brand);border-radius:14px;background:rgba(182,234,0,.06);display:grid;place-items:center;color:var(--text);font-size:13px;opacity:0;pointer-events:none;transition:opacity .16s}
.drop-ov.on{opacity:1}

/* ---------- popovers, modal, toast ---------- */
.pop{position:fixed;z-index:20;background:var(--panel);border-radius:12px;box-shadow:var(--pop-shadow);border:1px solid var(--line);opacity:0;transform:translateY(-4px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .16s var(--ease-out),transform .2s var(--ease-out)}
.pop.on{opacity:1;transform:none;pointer-events:auto}
.pop .ph{display:flex;align-items:center;justify-content:space-between;padding:12px 14px 0}
.pop .pb{padding:12px 14px 14px;display:grid;gap:8px}
.exp{width:320px}
.exp .note{font-size:11px;color:var(--text-3);line-height:1.45}
.prog{height:3px;border-radius:2px;background:var(--fill);overflow:hidden;display:none}
.prog.on{display:block}
.prog i{display:block;height:100%;width:100%;background:var(--text);transform-origin:left;transform:scaleX(0)}
.help{width:300px}
.keys{display:grid;grid-template-columns:1fr auto;gap:7px 12px;font-size:12px}
.keys span{color:var(--text-2)}
.keys kbd{font:inherit;font-size:11px;color:var(--text);background:var(--field);border-radius:5px;padding:1px 6px;justify-self:end}

.scrim{position:fixed;inset:0;z-index:30;background:rgba(10,12,16,.32);display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s var(--ease-out)}
.scrim.on{opacity:1;pointer-events:auto}
.modal{width:min(600px,calc(100vw - 32px));max-height:calc(100vh - 64px);overflow:auto;background:var(--panel);border-radius:14px;box-shadow:var(--pop-shadow);transform:translateY(6px) scale(.98);transition:transform .24s var(--ease-out)}
.scrim.on .modal{transform:none}
.modal .mh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px}
.modal .mh h2{margin:0;font-weight:400;font-size:15px}
.modal .mb{padding:8px 18px 18px;display:grid;gap:14px}
.pal{display:grid;gap:6px}
.pal-row{display:grid;grid-template-columns:26px minmax(0,1fr) 92px 104px 32px;gap:8px;align-items:center}
.pal-row .swatch{width:26px;height:26px}
.tin{height:var(--row);border-radius:var(--r);background:var(--field);border:0;padding:0 10px;font-size:12px;width:100%;min-width:0}
.tin:focus{box-shadow:inset 0 0 0 1.5px var(--focus)}
textarea.tin{height:64px;padding:8px 10px;resize:vertical;line-height:1.4}
.emb-list{display:grid;gap:6px}
.emb-list .emb{cursor:pointer}
.emb-list .emb[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--text)}

.toast{position:fixed;z-index:40;left:50%;bottom:72px;transform:translate(-50%,8px);background:var(--accent);color:var(--on-accent);padding:8px 14px;border-radius:9px;font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s var(--ease-out),transform .26s var(--ease-out);max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* covers the page while it starts up; no text and no fade, so switching pages feels instant */
.boot{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:var(--ws);color:var(--text-2)}
.boot.off{opacity:0;pointer-events:none}

@media (max-width:1180px){.app{--rw0:284px}}
@media (max-width:920px){
  .app{grid-template-columns:0 minmax(0,1fr) var(--rw,var(--rw0))}
  .rz-left{display:none}
  .panel.left{opacity:0;pointer-events:none}
}
/* small touch screens get a calm note instead of the tool */
.mobile-gate{display:none}
@media (max-width:760px),(hover:none) and (pointer:coarse) and (max-width:1024px){
  .mobile-gate{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:32px;background:#111215;text-align:center}
  .mobile-gate .m-logo{height:22px;width:auto;display:block;color:#B6EA00}
  .mobile-gate .m-logo .logo-b{fill:#F1F1F3}
  .mobile-gate p{margin:0;max-width:300px;font-size:13px;line-height:1.6;color:#686B73;letter-spacing:.01em}
  .app,.boot{display:none!important}
}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

.save-row{display:grid;grid-template-columns:1fr auto;gap:6px}
.srcprev{display:flex;justify-content:center;align-items:center;min-height:60px}
.srcprev canvas{width:auto;max-width:100%;height:auto!important}
.pal-row select.tin{padding:0 6px}
.cards.saved{margin-top:2px}
.pin{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:rgba(255,255,255,.18);box-shadow:0 0 0 1.5px #fff,0 0 0 4px rgba(182,234,0,.45);pointer-events:auto;cursor:move;opacity:0;transition:opacity .16s}
.board-ui.hot .pin,.board-ui.pinning .pin{opacity:1}
.lbl.grp{margin:14px 0 0}
.rows>.lbl.grp:first-child{margin-top:0}
.card .th canvas.live{position:absolute;inset:0;width:100%;height:100%;display:block}
.grads{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.grad{height:22px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.25);transition:transform .16s var(--ease-out)}
.grad:active{transform:scale(.92)}
.grad[aria-pressed="true"]{box-shadow:0 0 0 1.5px var(--panel),0 0 0 3px var(--text)}
.app,.pop,.modal,.toast{-webkit-user-select:none;user-select:none}
.app input,.app textarea,.pop input,.modal input,.modal textarea,.modal select{-webkit-user-select:text;user-select:text}
.workspace.orbit.in-board{cursor:grab}
.workspace.orbit.in-board.grabbing{cursor:grabbing}

</style>

    return s.root;
  }

  PageRegistry.sweep = {
    title: 'Background',
    engine: () => ({ build, Buf, RendererClass: SweepRenderer, svgFn: svg, extra: (L) => ({ look: L }), usesSource: () => false }),
    animated: (L) => L.sweep.motion !== 'still' || L.cam.move !== 'still',
